name: Architecture Federation

on:
  push:
    branches: [feat/architecture-ir-federation]
    paths:
      - "architecture/**"
      - "tests/test_architecture_federation.py"
      - ".github/workflows/architecture-federation.yml"
  pull_request:
    paths:
      - "architecture/**"
      - "tests/test_architecture_federation.py"
      - ".github/workflows/architecture-federation.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  HPL_ARCHITECTURE_JOIN_SHA: 9f540740b5c82a2e0375fa8508ca2139fbf994d7

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install certified HPL federation
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install "git+https://github.com/Mopati123/hpl-spec.git@${HPL_ARCHITECTURE_JOIN_SHA}"
      - name: Run AI authority-boundary tests
        run: python -m pytest -q tests/test_architecture_federation.py
      - name: Compile and emit HPL member receipt
        run: |
          mkdir -p evidence/architecture-federation
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from hpl.architecture import build_member_receipt

          path = Path("architecture/quantmuse.architecture.json")
          spec = json.loads(path.read_text(encoding="utf-8"))
          member = {
              "repository": "Mopati123/QuantMuse",
              "branch": "feat/architecture-ir-federation",
              "commit": os.environ["GITHUB_SHA"],
              "architecture_path": str(path),
              "architecture_id": spec["architecture_id"],
              "domain": spec["domain"],
          }
          receipt = build_member_receipt(
              spec,
              member,
              hpl_commit=os.environ["HPL_ARCHITECTURE_JOIN_SHA"],
              repository_commit=os.environ["GITHUB_SHA"],
          )
          assert receipt["execution_owner"] == "hpl.scheduler"
          assert receipt["repository_commit"] == os.environ["GITHUB_SHA"]
          Path("evidence/architecture-federation/member_receipt.json").write_text(
              json.dumps(receipt, sort_keys=True, indent=2) + "\n", encoding="utf-8"
          )
          print(f"QUANTMUSE_MEMBER_RECEIPT_SHA256={receipt['receipt_sha256']}")
          PY
      - name: Upload federation evidence
        uses: actions/upload-artifact@v4
        with:
          name: quantmuse-architecture-federation-evidence
          path: evidence/architecture-federation/
          if-no-files-found: error
          retention-days: 30
